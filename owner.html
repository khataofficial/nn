<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Store Admin</title><script src="theme.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer}a{color:var(--accent)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:20px;padding:4px 10px 16px}.brand b{color:var(--accent)}
aside button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;color:var(--soft);padding:11px 12px;border-radius:12px;font-weight:700;text-align:left;margin-bottom:2px}
aside button.on{background:var(--accent);color:var(--on)}
main{padding:22px;max-width:1100px;width:100%}
h1{margin:0 0 4px;font-size:24px}.sub{color:var(--soft);margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat span{color:var(--soft);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.stat strong{display:block;font-size:26px;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}th{text-align:left;font-size:11px;color:var(--soft);letter-spacing:.05em;padding:8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--chip)}.tag.new{background:#fef3c7;color:#92400e}.tag.done{background:#dcfce7;color:#166534}.tag.cancelled{background:#fee2e2;color:#991b1b}
.btn{border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--on);font-weight:700}.btn.alt{background:var(--chip);color:var(--ink)}
.tool{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tool input{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.empty{text-align:center;color:var(--soft);padding:36px 10px}
.pg{display:flex;gap:10px;align-items:center}.pg .im{width:40px;height:40px;border-radius:10px;background:var(--chip);overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--soft);position:relative;flex-shrink:0}.pg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(max-width:760px){.shell{display:block}aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:9;display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}.brand{display:none}aside button{flex:1;flex-direction:column;gap:2px;padding:8px 2px;font-size:11px;text-align:center;align-items:center;margin:0}main{padding:16px 14px 90px}}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--soft)}.bars i{display:block;width:100%;max-width:44px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#fff));min-height:3px}.bars b{font-size:10px;color:var(--ink);margin-bottom:3px}.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}.tp{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
</style></head><body>
<div class="shell" id="app"><div class="empty" style="grid-column:1/-1;padding-top:80px">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
var C=window.KHATA_CFG||{},sb=window.supabase.createClient(C.URL,C.KEY,{auth:{storageKey:'sb-khata',persistSession:true,autoRefreshToken:true}});
var $=function(i){return document.getElementById(i);},me=null,my=null,shop=null,orders=[],page='overview',q='',err='';
var esc=function(t){var d=document.createElement('div');d.textContent=String(t==null?'':t);return d.innerHTML;};
var rs=function(n){return 'Rs '+Math.round((+n||0)*100)/100;};
var url=function(u){u=String(u||'').trim();return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:'';};
var P=[['overview','📊','Overview'],['orders','🧾','Orders'],['products','📦','Products'],['customers','👥','Customers'],['store','⚙️','Store']];
function load(){return Promise.all([sb.rpc('store_orders_list'),sb.rpc('store_list')]).then(function(r){
 if(r[0].error){err='Could not load orders. Run store_setup.sql in Supabase.';orders=[];}else{err='';orders=Array.isArray(r[0].data)?r[0].data:[];}
 var L=Array.isArray(r[1].data)?r[1].data:[];my=L.filter(function(s){return s.owner===me.id;})[0]||null;
 return my?sb.rpc('store_get',{p_slug:my.slug}).then(function(x){shop=x.data||null;}):null;}).then(draw);}
function live(){return orders.filter(function(o){return o.status!=='cancelled';});}
function sum(a){return a.reduce(function(s,o){return s+(+o.total||0);},0);}
function draw(){
 var h='<aside><div class="brand">Store<b>Admin</b></div>'+P.map(function(p){return '<button data-p="'+p[0]+'" class="'+(page===p[0]?'on':'')+'"><span>'+p[1]+'</span>'+p[2]+'</button>';}).join('')+'<button id="tm"><span>🎨</span>Theme</button><button id="bk"><span>←</span>My Khata</button></aside><main>'+body()+'</main>';
 $('app').innerHTML=h;}
function body(){
 if(err)return '<h1>Store Admin</h1><div class="panel">'+esc(err)+'</div>';
 if(!my)return '<h1>Store Admin</h1><div class="panel"><div class="empty">Your store is not online yet.<br>Open My Khata › Settings › Online Store and turn it ON.<br><br><a class="btn" style="text-decoration:none;display:inline-block" href="index.html">Open My Khata</a></div></div>';
 var nw=orders.filter(function(o){return o.status==='new';});
 if(page==='overview'){var td=new Date().toDateString(),tod=live().filter(function(o){return new Date(o.created_at).toDateString()===td;});
  return '<h1>'+esc(my.name)+'</h1><div class="sub">Store dashboard · <a href="store.html?s='+encodeURIComponent(my.slug)+'" target="_blank">Open store ↗</a></div><div class="stats"><div class="stat"><span>🆕 New orders</span><strong>'+nw.length+'</strong></div><div class="stat"><span>💰 Today sales</span><strong>'+rs(sum(tod))+'</strong></div><div class="stat"><span>📈 Total sales</span><strong>'+rs(sum(live()))+'</strong></div><div class="stat"><span>📦 Products</span><strong>'+((shop&&shop.products)||[]).length+'</strong></div></div><div class="two"><div class="panel"><b>📅 Last 7 days</b>'+chart()+'</div><div class="panel"><b>🏆 Best sellers</b>'+top()+'</div></div><div class="panel"><b>🧾 Latest orders</b>'+ordersTable(orders.slice(0,6),false)+'</div>';}
 if(page==='orders')return '<h1>Orders</h1><div class="sub">Confirm, complete or cancel customer orders</div><div class="tool"><input id="sq" placeholder="Search customer or phone" value="'+esc(q)+'"></div><div class="panel">'+ordersTable(orders.filter(function(o){return !q||(String(o.customer_name)+String(o.phone)).toLowerCase().indexOf(q)>-1;}),true)+'</div>';
 if(page==='products'){var L=(shop&&shop.products)||[];return '<h1>Products</h1><div class="sub">Edit products and stock in My Khata. They update here automatically.</div><div class="panel">'+(L.length?'<table><tr><th>PRODUCT</th><th>CATEGORY</th><th>PRICE</th><th>STOCK</th></tr>'+L.map(function(p){var u=url(p.img);return '<tr><td><div class="pg"><div class="im"><b>'+esc(p.emoji||String(p.name).charAt(0).toUpperCase())+'</b>'+(u?'<img src="'+u+'" alt="" onerror="this.remove()">':'')+'</div><b>'+esc(p.name)+'</b></div></td><td>'+esc(p.cat||'—')+'</td><td>'+rs(p.price)+'</td><td>'+(p.qty>0?p.qty:'<span class="tag cancelled">Out</span>')+'</td></tr>';}).join('')+'</table>':'<div class="empty">No products</div>')+'<div class="tool" style="margin:12px 0 0"><a class="btn" style="text-decoration:none" href="index.html">Manage in My Khata</a></div></div>';}
 if(page==='customers'){var M={};orders.forEach(function(o){var k=o.phone||o.customer_name;M[k]=M[k]||{n:o.customer_name,p:o.phone,c:0,t:0};M[k].c++;if(o.status!=='cancelled')M[k].t+=+o.total||0;});var K=Object.keys(M).map(function(k){return M[k];}).sort(function(a,b){return b.t-a.t;});
  return '<h1>Customers</h1><div class="sub">People who ordered from your store</div><div class="panel">'+(K.length?'<table><tr><th>CUSTOMER</th><th>PHONE</th><th>ORDERS</th><th>SPENT</th></tr>'+K.map(function(c){return '<tr><td><b>'+esc(c.n)+'</b></td><td>'+esc(c.p)+'</td><td>'+c.c+'</td><td>'+rs(c.t)+'</td></tr>';}).join('')+'</table>':'<div class="empty">No customers yet</div>')+'</div>';}
 var u=new URL('store.html?s='+encodeURIComponent(my.slug),location.href).href;
 return '<h1>Store</h1><div class="sub">Your public store</div><div class="panel"><b>Store link</b><p style="overflow-wrap:anywhere">'+esc(u)+'</p><div class="tool"><button class="btn" id="cp">Copy link</button><a class="btn alt" style="text-decoration:none" href="'+esc(u)+'" target="_blank">Open store</a><a class="btn alt" style="text-decoration:none" href="index.html">Edit settings</a></div><p class="sub" style="margin:0">Delivery, payments, categories and the discount code are set in My Khata › Settings › Online Store.</p></div>';}
function chart(){var D=[],i,n=new Date();for(i=6;i>=0;i--){var d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i);D.push({k:d.toDateString(),l:d.toLocaleDateString('en',{weekday:'short'}),v:0});}
 live().forEach(function(o){var k=new Date(o.created_at).toDateString();D.forEach(function(x){if(x.k===k)x.v+=+o.total||0;});});var mx=Math.max.apply(null,D.map(function(x){return x.v;}))||1;
 return '<div class="bars">'+D.map(function(x){return '<div><b>'+(x.v?Math.round(x.v/100)/10+'k':'')+'</b><i style="height:'+Math.max(2,x.v/mx*100)+'%"></i><span>'+x.l+'</span></div>';}).join('')+'</div>';}
function top(){var M={};live().forEach(function(o){(o.items||[]).forEach(function(i){M[i.name]=(M[i.name]||0)+(+i.qty||0);});});var K=Object.keys(M).sort(function(a,b){return M[b]-M[a];}).slice(0,5);return K.length?K.map(function(k,i){return '<div class="tp"><span>'+['🥇','🥈','🥉','4️⃣','5️⃣'][i]+' '+esc(k)+'</span><b>'+M[k]+'</b></div>';}).join(''):'<div class="empty">No sales yet</div>';}
function ordersTable(L,act){if(!L.length)return '<div class="empty">No orders yet</div>';
 return '<table><tr><th>CUSTOMER</th><th>ITEMS</th><th>TOTAL</th><th>STATUS</th>'+(act?'<th></th>':'')+'</tr>'+L.map(function(o){var t=o.created_at?new Date(o.created_at).toLocaleString():'';var st=o.status==='done'?'done':o.status==='cancelled'?'cancelled':'new';
 return '<tr><td><b>'+esc(o.customer_name)+'</b><br><span style="color:var(--soft);font-size:12px">'+esc(o.phone||'')+(o.address?' · '+esc(o.address):'')+'<br>'+t+'</span></td><td>'+(o.items||[]).map(function(i){return esc(i.name)+' ×'+i.qty;}).join('<br>')+'</td><td><b>'+rs(o.total)+'</b></td><td><span class="tag '+st+'">'+(st==='new'?'New':st==='done'?'Done':'Cancelled')+'</span></td>'+(act?'<td style="white-space:nowrap">'+(o.status==='new'?'<button class="btn" data-s="done" data-id="'+esc(o.id)+'">Done</button> <button class="btn alt" data-s="cancelled" data-id="'+esc(o.id)+'">Cancel</button> ':'')+'<a class="btn alt" style="text-decoration:none;display:inline-block" target="_blank" href="https://wa.me/'+String(o.phone||'').replace(/\D/g,'').replace(/^0/,'92')+'">WhatsApp</a></td>':'')+'</tr>';}).join('')+'</table>';}
document.addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(b){page=b.getAttribute('data-p');draw();return;}
 b=e.target.closest('[data-s]');if(b){var id=b.getAttribute('data-id'),s=b.getAttribute('data-s');if(s==='cancelled'&&!confirm('Cancel this order?'))return;b.disabled=true;sb.rpc('store_order_status',{p_id:id,p_status:s}).then(function(){load();});return;}
 if(e.target.closest('#tm')){KTheme.panel();return;}if(e.target.closest('#bk')){location.href='index.html';return;}
 if(e.target.closest('#cp')&&my&&navigator.clipboard)navigator.clipboard.writeText(new URL('store.html?s='+encodeURIComponent(my.slug),location.href).href);});
document.addEventListener('input',function(e){if(e.target.id==='sq'){q=e.target.value.trim().toLowerCase();var pos=e.target.selectionStart;draw();var n=$('sq');if(n){n.focus();n.setSelectionRange(pos,pos);}}});
sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(!s){$('app').innerHTML='<div class="empty" style="grid-column:1/-1;padding-top:80px"><h1>Store Admin</h1>Log in to My Khata first.<br><br><a class="btn" style="text-decoration:none;display:inline-block" href="index.html">Open My Khata</a></div>';return;}me=s.user;load();setInterval(function(){if(page==='orders'||page==='overview')load();},20000);});
})();
</script></body></html>
